services:
  fast-router:
    environment:
      WEKNORA_IMPORT_ENABLED: ${WEKNORA_IMPORT_ENABLED:-false}
    ports: !override
      - "127.0.0.1:${FAST_ROUTER_SERVER_PORT:-8000}:8000"
      - "${SERVER_TAILSCALE_HOST:-100.74.163.113}:${FAST_ROUTER_SERVER_PORT:-8000}:8000"

  tool-gateway:
    ports: !override
      - "127.0.0.1:${MCP_SERVER_PORT:-18765}:8765"
      - "${SERVER_TAILSCALE_HOST:-100.74.163.113}:${MCP_SERVER_PORT:-18765}:8765"

  opensearch-dashboards:
    ports: !override
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
      - "${SERVER_TAILSCALE_HOST:-100.74.163.113}:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
