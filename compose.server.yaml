services:
  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_SERVER_PORT:-15432}:5432"

  opensearch:
    ports: !override
      - "127.0.0.1:${OPENSEARCH_SERVER_PORT:-19200}:9200"

  fast-router:
    environment:
      WEKNORA_IMPORT_ENABLED: ${WEKNORA_IMPORT_ENABLED:-false}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-http://100.74.163.113:3000,http://127.0.0.1:3000}
    ports: !override
      - "127.0.0.1:${FAST_ROUTER_SERVER_PORT:-8000}:8000"
      - "${SERVER_TAILSCALE_HOST:-100.74.163.113}:${FAST_ROUTER_SERVER_PORT:-8000}:8000"

  md-admin:
    build:
      args:
        VITE_API_BASE_URL: ${MD_ADMIN_API_BASE_URL:-http://100.74.163.113:8000}
    ports: !override
      - "127.0.0.1:${MD_ADMIN_SERVER_PORT:-3000}:80"
      - "${SERVER_TAILSCALE_HOST:-100.74.163.113}:${MD_ADMIN_SERVER_PORT:-3000}:80"

  tool-gateway:
    ports: !override
      - "127.0.0.1:${MCP_SERVER_PORT:-18765}:8765"
      - "${SERVER_TAILSCALE_HOST:-100.74.163.113}:${MCP_SERVER_PORT:-18765}:8765"

  opensearch-dashboards:
    ports: !override
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
      - "${SERVER_TAILSCALE_HOST:-100.74.163.113}:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
