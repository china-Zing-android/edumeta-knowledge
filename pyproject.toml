[project]
name = "edumeta-knowledge"
version = "0.1.0"
description = "University knowledge-base Agent MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "opensearch-py>=2.6.0",
  "jsonschema>=4.23.0",
  "mcp>=1.0.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

# This is a monorepo (apps/, pipelines/, infra/ are sibling components), not a
# single importable package. The real source roots are exposed via pythonpath
# below and per-component installs. Tell setuptools there is no top-level
# package to discover, so `pip install -e .[dev]` only installs dependencies.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/fast-router/src",
  "pipelines/catalog-parser/src",
  "pipelines/indexer/src"
]
