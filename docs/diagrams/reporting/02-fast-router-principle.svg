<svg viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="c2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="m2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
    <style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0}.title{font-size:28px;font-weight:700;fill:#f8fafc}.sub{font-size:14px;fill:#94a3b8}.h{font-size:17px;font-weight:700;fill:#f8fafc}.p{font-size:13px;fill:#cbd5e1}.small{font-size:11px;fill:#94a3b8}.tag{font-size:12px;font-weight:700}.box{stroke-width:1.8}</style>
  </defs>
  <rect width="1600" height="1040" fill="#0f172a"/><rect width="1600" height="1040" fill="url(#g2)"/>
  <text x="48" y="52" class="title">Fast Router 可以理解成一个“问题分流员”</text>
  <text x="48" y="82" class="sub">它不负责写长答案，只负责判断：用户在问谁、问什么、应该去哪里找资料</text>

  <rect x="535" y="120" width="530" height="88" rx="32" fill="rgba(59,130,246,.34)" stroke="#60a5fa" class="box"/>
  <text x="800" y="154" class="h" text-anchor="middle">用户提出一个自然语言问题</text>
  <text x="800" y="182" class="p" text-anchor="middle">例如：“MIT EECS PhD 申请需要提交哪些材料？”</text>
  <path d="M800 208V248" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="440" y="248" width="720" height="100" rx="12" fill="rgba(6,78,59,.52)" stroke="#34d399" class="box"/>
  <circle cx="478" cy="281" r="18" fill="#059669"/><text x="478" y="287" fill="white" font-size="15" font-weight="700" text-anchor="middle">1</text>
  <text x="800" y="282" class="h" text-anchor="middle">先确认用户在问哪所学校、哪个专业</text>
  <text x="800" y="313" class="p" text-anchor="middle">能确定：继续处理　｜　不能确定：先反问，不猜学校、不默认 MIT</text>
  <path d="M800 348V388" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="280" y="388" width="1040" height="100" rx="12" fill="rgba(6,78,59,.52)" stroke="#34d399" class="box"/>
  <circle cx="318" cy="421" r="18" fill="#059669"/><text x="318" y="427" fill="white" font-size="15" font-weight="700" text-anchor="middle">2</text>
  <text x="800" y="422" class="h" text-anchor="middle">再判断用户想了解的深度</text>
  <text x="800" y="453" class="p" text-anchor="middle">不是简单看某个词，而是按“问题真正想完成什么”来分流</text>
  <path d="M450 488V530" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#c2)"/><path d="M800 488V530" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#c2)"/><path d="M1150 488V530" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#m2)"/>

  <rect x="80" y="530" width="450" height="205" rx="14" fill="rgba(8,51,68,.48)" stroke="#22d3ee" class="box"/>
  <text x="305" y="568" class="h" text-anchor="middle">A. 想先了解学校或专业</text>
  <text x="115" y="606" class="p">常见说法：</text><text x="115" y="637" class="p">“MIT 有 Economics 本科吗？”</text><text x="115" y="666" class="p">“这个专业怎么样？”</text><text x="115" y="695" class="p">“计算机专业有哪些院校？”</text>
  <rect x="115" y="708" width="380" height="1" fill="#334155"/><text x="305" y="726" class="tag" fill="#22d3ee" text-anchor="middle">走 Markdown 整理出的目录和上下文</text>

  <rect x="575" y="530" width="450" height="205" rx="14" fill="rgba(8,51,68,.48)" stroke="#22d3ee" class="box"/>
  <text x="800" y="568" class="h" text-anchor="middle">B. 问一个明确数字或规则</text>
  <text x="610" y="606" class="p">常见说法：</text><text x="610" y="637" class="p">“学费是多少？”</text><text x="610" y="666" class="p">“截止时间是什么时候？”</text><text x="610" y="695" class="p">“TOEFL 最低要求是多少？”</text>
  <rect x="610" y="708" width="380" height="1" fill="#334155"/><text x="800" y="726" class="tag" fill="#22d3ee" text-anchor="middle">走 Markdown 中已拆好的关键事实</text>

  <rect x="1070" y="530" width="450" height="205" rx="14" fill="rgba(120,53,15,.40)" stroke="#fbbf24" class="box"/>
  <text x="1295" y="568" class="h" text-anchor="middle">C. 追问官网页面里的细节</text>
  <text x="1105" y="606" class="p">常见说法：</text><text x="1105" y="637" class="p">“申请要提交哪些材料？”</text><text x="1105" y="666" class="p">“课程设置具体是什么？”</text><text x="1105" y="695" class="p">“非计算机背景能不能申请？”</text>
  <rect x="1105" y="708" width="380" height="1" fill="#4b3525"/><text x="1295" y="726" class="tag" fill="#fbbf24" text-anchor="middle">先锁定项目，再去 WeKnora 读官网</text>

  <path d="M305 735V785H625" fill="none" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#c2)"/><path d="M800 735V785" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#c2)"/><path d="M1295 735V785H975" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#m2)"/>
  <rect x="430" y="785" width="740" height="100" rx="12" fill="rgba(59,130,246,.30)" stroke="#60a5fa" class="box"/>
  <circle cx="470" cy="818" r="18" fill="#2563eb"/><text x="470" y="824" fill="white" font-size="15" font-weight="700" text-anchor="middle">3</text>
  <text x="800" y="819" class="h" text-anchor="middle">统一返回“找到什么、来源是什么、还缺什么”</text>
  <text x="800" y="851" class="p" text-anchor="middle">AI 再把结构化结果组织成学生容易读懂的回答</text>

  <rect x="80" y="920" width="1440" height="78" rx="10" fill="rgba(30,41,59,.78)" stroke="#475569"/>
  <text x="110" y="949" class="tag" fill="#fb7185">三条最重要的防错规则：</text>
  <text x="350" y="949" class="p">① 问题不清楚先反问</text><text x="650" y="949" class="p">② 先锁定具体学校和项目</text><text x="1030" y="949" class="p">③ 没有证据就明确说不知道</text>
  <text x="110" y="978" class="small">例：即使一句话同时出现“申请材料、TOEFL、GRE”，也要按“完整申请材料”处理，不能只返回英语分数。</text>
</svg>
