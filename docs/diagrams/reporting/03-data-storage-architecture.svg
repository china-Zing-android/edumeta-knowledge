<svg viewBox="0 0 1600 940" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="g3" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="a3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="c3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="m3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
    <style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0}.title{font-size:28px;font-weight:700;fill:#f8fafc}.sub{font-size:14px;fill:#94a3b8}.h{font-size:18px;font-weight:700;fill:#f8fafc}.p{font-size:13px;fill:#cbd5e1}.small{font-size:11px;fill:#94a3b8}.tag{font-size:12px;font-weight:700}.box{stroke-width:1.8}</style>
  </defs>
  <rect width="1600" height="940" fill="#0f172a"/><rect width="1600" height="940" fill="url(#g3)"/>
  <text x="48" y="52" class="title">数据放在哪里？可以理解成 4 个不同用途的“柜子”</text>
  <text x="48" y="82" class="sub">不是把所有东西塞进一个知识库，而是让每类数据放在最适合它的位置</text>

  <rect x="55" y="142" width="335" height="440" rx="16" fill="rgba(8,51,68,.46)" stroke="#22d3ee" class="box"/>
  <circle cx="105" cy="190" r="27" fill="#0891b2"/><text x="105" y="198" fill="white" font-size="20" font-weight="700" text-anchor="middle">1</text>
  <text x="222" y="197" class="h" text-anchor="middle">原始资料柜</text>
  <text x="222" y="225" class="tag" fill="#22d3ee" text-anchor="middle">Markdown 文件</text>
  <line x1="85" y1="250" x2="360" y2="250" stroke="#164e63"/>
  <text x="85" y="286" class="p">这里保存：</text><text x="105" y="319" class="p">• 每次上传的学校原始资料</text><text x="105" y="350" class="p">• 解析后的标准文件</text><text x="105" y="381" class="p">• 文档中发现的官网链接</text>
  <rect x="85" y="422" width="275" height="98" rx="10" fill="rgba(59,130,246,.22)" stroke="#60a5fa"/>
  <text x="222" y="454" class="p" text-anchor="middle">例：MIT 专业列表、学费表、</text><text x="222" y="480" class="p" text-anchor="middle">研究生项目和相关官网 URL</text>
  <text x="222" y="548" class="small" text-anchor="middle">作用：保留输入和重新处理的基础</text>

  <path d="M390 362H430" stroke="#64748b" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="430" y="142" width="335" height="440" rx="16" fill="rgba(76,29,149,.46)" stroke="#a78bfa" class="box"/>
  <circle cx="480" cy="190" r="27" fill="#7c3aed"/><text x="480" y="198" fill="white" font-size="20" font-weight="700" text-anchor="middle">2</text>
  <text x="598" y="197" class="h" text-anchor="middle">管理账本</text>
  <text x="598" y="225" class="tag" fill="#a78bfa" text-anchor="middle">PostgreSQL</text>
  <line x1="460" y1="250" x2="735" y2="250" stroke="#4c1d95"/>
  <text x="460" y="286" class="p">这里记录：</text><text x="480" y="319" class="p">• 哪些学校已经入库</text><text x="480" y="350" class="p">• 当前使用哪个数据版本</text><text x="480" y="381" class="p">• 每个事实和官网链接的来源</text><text x="480" y="412" class="p">• WeKnora 导入成功还是失败</text>
  <rect x="460" y="446" width="275" height="74" rx="10" fill="rgba(76,29,149,.28)" stroke="#a78bfa"/>
  <text x="598" y="476" class="p" text-anchor="middle">例：MIT 当前版本、Economics</text><text x="598" y="501" class="p" text-anchor="middle">专业关联哪个官方页面</text>
  <text x="598" y="548" class="small" text-anchor="middle">作用：系统的权威记录，可回滚</text>

  <path d="M765 362H805" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#c3)"/>
  <rect x="805" y="142" width="335" height="440" rx="16" fill="rgba(8,51,68,.46)" stroke="#22d3ee" class="box"/>
  <circle cx="855" cy="190" r="27" fill="#0891b2"/><text x="855" y="198" fill="white" font-size="20" font-weight="700" text-anchor="middle">3</text>
  <text x="973" y="197" class="h" text-anchor="middle">快速查找架</text>
  <text x="973" y="225" class="tag" fill="#22d3ee" text-anchor="middle">OpenSearch</text>
  <line x1="835" y1="250" x2="1110" y2="250" stroke="#164e63"/>
  <text x="835" y="286" class="p">这里放方便检索的副本：</text><text x="855" y="319" class="p">• 学校和专业目录</text><text x="855" y="350" class="p">• 学费、截止时间、语言要求</text><text x="855" y="381" class="p">• 专业的简单介绍和相关方向</text><text x="855" y="412" class="p">• 专业对应的官网地址</text>
  <rect x="835" y="446" width="275" height="74" rx="10" fill="rgba(8,51,68,.30)" stroke="#22d3ee"/>
  <text x="973" y="476" class="p" text-anchor="middle">用户问常见问题时，</text><text x="973" y="501" class="p" text-anchor="middle">主要从这里快速找到答案</text>
  <text x="973" y="548" class="small" text-anchor="middle">作用：快；可以从管理账本重建</text>

  <path d="M1140 362H1180" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#m3)"/>
  <rect x="1180" y="142" width="365" height="440" rx="16" fill="rgba(120,53,15,.42)" stroke="#fbbf24" class="box"/>
  <circle cx="1230" cy="190" r="27" fill="#d97706"/><text x="1230" y="198" fill="white" font-size="20" font-weight="700" text-anchor="middle">4</text>
  <text x="1362" y="197" class="h" text-anchor="middle">官网全文柜</text>
  <text x="1362" y="225" class="tag" fill="#fbbf24" text-anchor="middle">WeKnora</text>
  <line x1="1210" y1="250" x2="1515" y2="250" stroke="#78350f"/>
  <text x="1210" y="286" class="p">这里保存：</text><text x="1230" y="319" class="p">• 官网页面抓取后的正文</text><text x="1230" y="350" class="p">• 可引用的真实网页片段</text><text x="1230" y="381" class="p">• 页面属于哪个学校和专业</text>
  <rect x="1210" y="422" width="305" height="98" rx="10" fill="rgba(120,53,15,.27)" stroke="#fbbf24"/>
  <text x="1362" y="454" class="p" text-anchor="middle">例：EECS PhD 申请材料页面、</text><text x="1362" y="480" class="p" text-anchor="middle">Economics 课程设置页面</text>
  <text x="1362" y="548" class="small" text-anchor="middle">作用：回答官网细节并提供证据</text>

  <text x="55" y="638" class="tag" fill="#60a5fa">用户提问时怎么使用这 4 个柜子？</text>
  <rect x="55" y="674" width="700" height="150" rx="14" fill="rgba(8,51,68,.28)" stroke="#22d3ee" class="box"/>
  <text x="85" y="710" class="h">常见问题：只查“快速查找架”</text>
  <text x="85" y="746" class="p">例：“MIT 本科学费是多少？” → 直接找到已整理的学费事实</text>
  <text x="85" y="780" class="p">例：“MIT 有 Economics 本科吗？” → 找到专业和简单上下文</text>
  <text x="85" y="807" class="small">查询速度快，不需要读取官网全文</text>

  <rect x="795" y="674" width="750" height="150" rx="14" fill="rgba(120,53,15,.25)" stroke="#fbbf24" class="box"/>
  <text x="825" y="710" class="h">细节问题：先在快速架锁定对象，再去官网全文柜</text>
  <text x="825" y="746" class="p">例：“MIT EECS PhD 要提交哪些材料？”</text>
  <text x="825" y="780" class="p">先锁定 MIT EECS PhD → 只读取它关联的官网页面</text>
  <text x="825" y="807" class="small">这样不会把别的学校、别的项目或本科页面混进答案</text>

  <rect x="55" y="858" width="1490" height="52" rx="10" fill="rgba(30,41,59,.78)" stroke="#475569"/>
  <text x="800" y="890" class="tag" fill="#f8fafc" text-anchor="middle">一句话总结：PostgreSQL 管“哪个版本是真的”，OpenSearch 管“快速找到”，WeKnora 管“官网具体怎么写”。</text>
</svg>
