<svg viewBox="0 0 1600 940" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
    <style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0}.title{font-size:28px;font-weight:700;fill:#f8fafc}.sub{font-size:14px;fill:#94a3b8}.h{font-size:17px;font-weight:700;fill:#f8fafc}.p{font-size:13px;fill:#cbd5e1}.small{font-size:11px;fill:#94a3b8}.tag{font-size:12px;font-weight:700}.box{stroke-width:1.8}</style>
  </defs>
  <rect width="1600" height="940" fill="#0f172a"/><rect width="1600" height="940" fill="url(#g)"/>
  <text x="48" y="52" class="title">一份学校资料，如何变成可以直接提问的知识？</text>
  <text x="48" y="82" class="sub">先把 Markdown 里的常用信息整理好；只有用户追问细节时，才去读取对应的官网页面</text>

  <text x="48" y="132" class="tag" fill="#34d399">第一步：上传和整理资料</text>
  <rect x="60" y="164" width="230" height="120" rx="10" fill="rgba(8,51,68,.58)" stroke="#22d3ee" class="box"/>
  <circle cx="91" cy="194" r="16" fill="#0891b2"/><text x="91" y="200" fill="white" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <text x="175" y="201" class="h" text-anchor="middle">上传学校 Markdown</text>
  <text x="175" y="232" class="p" text-anchor="middle">例如：MIT 完整知识资料</text>
  <text x="175" y="260" class="tag" fill="#22d3ee" text-anchor="middle">这是主要原始资料</text>
  <path d="M290 224H350" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#cyan)"/>

  <rect x="350" y="144" width="370" height="160" rx="10" fill="rgba(6,78,59,.55)" stroke="#34d399" class="box"/>
  <circle cx="382" cy="176" r="16" fill="#059669"/><text x="382" y="182" fill="white" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text x="535" y="183" class="h" text-anchor="middle">系统自动整理成 4 类内容</text>
  <text x="385" y="218" class="p">• 学校和学院介绍</text><text x="555" y="218" class="p">• 本科和研究生专业</text>
  <text x="385" y="249" class="p">• 学费、截止时间等数字</text><text x="555" y="249" class="p">• 文档里的官网链接</text>
  <text x="535" y="282" class="small" text-anchor="middle">不同学校的 Markdown 格式不同，也会整理成同一种结构</text>
  <path d="M720 224H780" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="780" y="144" width="330" height="160" rx="10" fill="rgba(8,51,68,.52)" stroke="#22d3ee" class="box"/>
  <circle cx="812" cy="176" r="16" fill="#0891b2"/><text x="812" y="182" fill="white" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text x="945" y="183" class="h" text-anchor="middle">常用信息放入快速资料库</text>
  <text x="945" y="220" class="p" text-anchor="middle">专业目录、关键数字、简单介绍</text>
  <text x="945" y="249" class="p" text-anchor="middle">以及“这个专业还可以继续问什么”</text>
  <text x="945" y="281" class="tag" fill="#22d3ee" text-anchor="middle">来自 Markdown，可快速返回</text>
  <path d="M1110 224H1170" stroke="#fbbf24" stroke-width="2" marker-end="url(#amber)"/>

  <rect x="1170" y="144" width="350" height="160" rx="10" fill="rgba(120,53,15,.42)" stroke="#fbbf24" class="box"/>
  <circle cx="1202" cy="176" r="16" fill="#d97706"/><text x="1202" y="182" fill="white" font-size="14" font-weight="700" text-anchor="middle">4</text>
  <text x="1345" y="183" class="h" text-anchor="middle">官网链接交给 WeKnora</text>
  <text x="1345" y="220" class="p" text-anchor="middle">WeKnora 抓取官网页面全文</text>
  <text x="1345" y="249" class="p" text-anchor="middle">保留申请材料、课程说明等细节</text>
  <text x="1345" y="281" class="tag" fill="#fbbf24" text-anchor="middle">来自 URL 网页，只在需要时查询</text>

  <line x1="48" y1="348" x2="1552" y2="348" stroke="#334155" stroke-width="1"/>
  <text x="48" y="394" class="tag" fill="#60a5fa">第二步：用户提问时，先判断“快速资料够不够”</text>

  <rect x="60" y="430" width="700" height="370" rx="14" fill="rgba(8,51,68,.25)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="90" y="467" class="h">情况 A：常见问题，直接从 Markdown 整理结果回答</text>
  <rect x="105" y="500" width="300" height="82" rx="28" fill="rgba(59,130,246,.34)" stroke="#60a5fa"/>
  <text x="255" y="535" class="p" text-anchor="middle">“MIT 有 Economics 本科专业吗？”</text>
  <text x="255" y="559" class="small" text-anchor="middle">用户只是想先了解专业</text>
  <path d="M405 541H465" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#cyan)"/>
  <rect x="465" y="493" width="250" height="96" rx="10" fill="rgba(8,51,68,.58)" stroke="#22d3ee" class="box"/>
  <text x="590" y="526" class="h" text-anchor="middle">快速资料库</text>
  <text x="590" y="553" class="p" text-anchor="middle">找到 14-1 Economics</text>
  <text x="590" y="576" class="small" text-anchor="middle">不访问 WeKnora</text>
  <path d="M590 589V635" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#cyan)"/>
  <rect x="160" y="635" width="500" height="112" rx="10" fill="rgba(59,130,246,.32)" stroke="#60a5fa" class="box"/>
  <text x="410" y="668" class="h" text-anchor="middle">返回学生容易理解的结果</text>
  <text x="410" y="698" class="p" text-anchor="middle">有。MIT 提供 14-1 Economics 本科 SB 专业。</text>
  <text x="410" y="725" class="small" text-anchor="middle">同时可提示：还有 Mathematical Economics 等相关方向</text>

  <rect x="800" y="430" width="720" height="370" rx="14" fill="rgba(120,53,15,.22)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="830" y="467" class="h">情况 B：追问细节，才去读取对应官网页面</text>
  <rect x="850" y="500" width="270" height="82" rx="28" fill="rgba(59,130,246,.34)" stroke="#60a5fa"/>
  <text x="985" y="535" class="p" text-anchor="middle">“那课程设置呢？”</text>
  <text x="985" y="559" class="small" text-anchor="middle">用户明确要求页面细节</text>
  <path d="M1120 541H1170" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1170" y="493" width="300" height="96" rx="10" fill="rgba(6,78,59,.52)" stroke="#34d399" class="box"/>
  <text x="1320" y="526" class="h" text-anchor="middle">先锁定具体对象</text>
  <text x="1320" y="553" class="p" text-anchor="middle">MIT → 14-1 Economics</text>
  <text x="1320" y="576" class="small" text-anchor="middle">避免查到别的项目</text>
  <path d="M1320 589V635" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#amber)"/>
  <rect x="910" y="635" width="500" height="112" rx="10" fill="rgba(120,53,15,.42)" stroke="#fbbf24" class="box"/>
  <text x="1160" y="668" class="h" text-anchor="middle">WeKnora 只读 14-1 对应的官网页面</text>
  <text x="1160" y="698" class="p" text-anchor="middle">返回课程核心、选修方向和真实网页片段</text>
  <text x="1160" y="725" class="small" text-anchor="middle">回答可以引用官网证据，不会在整个知识库里乱搜</text>

  <rect x="60" y="842" width="1460" height="56" rx="10" fill="rgba(30,41,59,.78)" stroke="#475569"/>
  <circle cx="92" cy="870" r="8" fill="#22d3ee"/><text x="112" y="875" class="p">青色：Markdown 已整理好的快速内容</text>
  <circle cx="475" cy="870" r="8" fill="#fbbf24"/><text x="495" y="875" class="p">黄色：WeKnora 中的官网页面细节</text>
  <text x="950" y="875" class="tag" fill="#fb7185">核心原则：用户没有追问细节，就不主动读取网页</text>
</svg>
