services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16
    shm_size: 256mb
    environment:
      POSTGRES_DB: edumeta
      POSTGRES_USER: edumeta
      POSTGRES_PASSWORD: edumeta
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumeta -d edumeta"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "EdumetaDev123!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    profiles:
      - dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "${OPENSEARCH_DASHBOARDS_BIND_HOST:-127.0.0.1}:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  bootstrap:
    image: edumeta-fast-router:local
    build:
      context: ..
      dockerfile: apps/fast-router/Dockerfile
      args:
        PIP_INDEX_URL: ${FAST_ROUTER_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      POSTGRES_DSN: postgresql://edumeta:edumeta@postgres:5432/edumeta
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_PUBLISH_TIMEOUT_SECONDS: ${OPENSEARCH_PUBLISH_TIMEOUT_SECONDS:-120}
    command:
      - python
      - /app/scripts/apply_postgres_migrations.py
      - --postgres-dsn
      - postgresql://edumeta:edumeta@postgres:5432/edumeta
      - --migrations-dir
      - /app/infra/postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  fast-router:
    image: edumeta-fast-router:local
    build:
      context: ..
      dockerfile: apps/fast-router/Dockerfile
      args:
        PIP_INDEX_URL: ${FAST_ROUTER_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      POSTGRES_DSN: postgresql://edumeta:edumeta@postgres:5432/edumeta
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_PUBLISH_TIMEOUT_SECONDS: ${OPENSEARCH_PUBLISH_TIMEOUT_SECONDS:-120}
      OPENSEARCH_RETRIEVAL_ATTEMPT_TIMEOUT_SECONDS: ${OPENSEARCH_RETRIEVAL_ATTEMPT_TIMEOUT_SECONDS:-0.45}
      OPENSEARCH_RETRIEVAL_MAX_RETRIES: ${OPENSEARCH_RETRIEVAL_MAX_RETRIES:-1}
      INGESTION_DATA_ROOT: /app/data/ingestions
      WEKNORA_BASE_URL: ${WEKNORA_BASE_URL:-}
      WEKNORA_API_KEY: ${WEKNORA_API_KEY:-}
      WEKNORA_KNOWLEDGE_BASE_ID: ${WEKNORA_KNOWLEDGE_BASE_ID:-}
      WEKNORA_KB_TEMPLATE_ID: ${WEKNORA_KB_TEMPLATE_ID:-}
      WEKNORA_IMPORT_ENABLED: ${WEKNORA_IMPORT_ENABLED:-true}
      WEKNORA_API_KEY_HEADER: ${WEKNORA_API_KEY_HEADER:-X-API-Key}
      WEKNORA_SEARCH_TIMEOUT_SECONDS: ${WEKNORA_SEARCH_TIMEOUT_SECONDS:-2.8}
      TRACE_LOG_PATH: ${TRACE_LOG_PATH:-/app/data/traces/retrieval.jsonl}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      INGESTION_SOURCE_PARENT: ${INGESTION_SOURCE_PARENT:-/app/data/raw-md}
      INGESTION_SOURCE_ROOT: ${INGESTION_SOURCE_ROOT:-}
    volumes:
      - ingestion_data:/app/data/ingestions
      - batch_import_state:/app/data/import-state
      - ../data/raw-md:/app/data/raw-md:ro
      - ../data/traces:/app/data/traces
      - ../qa:/app/qa:ro
    ports:
      - "${FAST_ROUTER_BIND_HOST:-127.0.0.1}:${FAST_ROUTER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); raise SystemExit(0 if d['status']=='ok' else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  md-admin:
    image: edumeta-md-admin:local
    build:
      context: ..
      dockerfile: apps/md-admin/Dockerfile
      args:
        NPM_REGISTRY: ${MD_ADMIN_NPM_REGISTRY:-https://registry.npmjs.org}
        VITE_API_BASE_URL: ${MD_ADMIN_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "${MD_ADMIN_BIND_HOST:-127.0.0.1}:${MD_ADMIN_PORT:-3000}:80"
    depends_on:
      fast-router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  tool-gateway:
    build:
      context: ..
      dockerfile: apps/tool-gateway/Dockerfile
      args:
        NPM_REGISTRY: ${TOOL_GATEWAY_NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      FAST_ROUTER_BASE_URL: http://fast-router:8000
      FAST_ROUTER_TIMEOUT_MS: ${FAST_ROUTER_TIMEOUT_MS:-3500}
    ports:
      - "${MCP_BIND_HOST:-127.0.0.1}:${MCP_PORT:-8765}:8765"
    depends_on:
      fast-router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  opensearch_data:
  ingestion_data:
  batch_import_state:
